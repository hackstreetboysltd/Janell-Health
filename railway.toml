# Railway deploy config — https://railway.app
# Connect repo → Railway detects Dockerfile → attach Postgres plugin → set env vars from .env.example.

[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/api/health"
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
